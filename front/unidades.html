<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas Ambientais</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">
            <img src="img/logo.png" alt="logo do TeamMates">
        </div>

        <ul class="nav-bar">
            <li><a href="home.html">Início</a></li>
            <li><a href="index.html">Unidades</a></li>
            <li><a href="novo-comunicado.html">Enviar Comunicado</a></li>
        </ul>
    </header>

    <section class="unidade">

        <div class="header-nav">

            <a href="home.html" class="voltar">
                <img src="img/icon-back.png" alt="Voltar">
                Voltar ao Início
            </a>

            <h1 id="nome-unidade"></h1>

            <p class="cidade" id="cidade-unidade"></p>

        </div>

        <div class="unidade-info">

            <p>
                <strong>Data da Criação:</strong>
                <span id="data-criacao"></span>
            </p>

            <p>
                <strong>Instituição responsável:</strong>
                <span id="instituicao"></span>
            </p>

            <p class="descricao">
                <strong>Detalhes sobre o parque / curiosidade:</strong>
                <span id="descricao-unidade"></span>
            </p>

            <button id="btn-comunicado">
                Enviar comunicado para essa unidade
            </button>

        </div>

    </section>

    <section class="comunicados">

        <h2 id="titulo-comunicados">
            Comunicados da unidade
        </h2>

        <div id="lista-comunicados">

            <!-- Exemplo de card -->
            <div class="comunicado-card">

                <div class="comunicado-topo">

                    <div class="usuario-info">

                        <img src="img/user.png" alt="Usuário">

                        <div>
                            <h4>Nome do usuário</h4>
                            <span>10/06/2026</span>
                        </div>

                    </div>

                </div>

                <h3>Título do comunicado</h3>

                <p>
                    Descrição do comunicado.
                </p>

            </div>

        </div>

    </section>

    <script src="js/notificacoes.js"></script>
    <script src="js/unidade1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

</body>
</html>
